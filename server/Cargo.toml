[package]
name = "phonecam-server"
version = "0.1.0"
edition = "2021"
description = "Receives the phone camera stream and feeds the PhoneCam virtual webcam"
publish = false

[dependencies]
# Windows-only on purpose: the shared memory handoff to the DirectShow filter is
# the whole reason this is not portable, and pretending otherwise would add a
# layer that never gets used.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security", # CreateFileMappingW is gated behind this
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
zune-core = "0.5.1"
zune-jpeg = "0.5.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
