[package]
name = "phonecam-server"
version = "2.0.0"
edition = "2021"
description = "Receives the phone camera stream and feeds the PhoneCam virtual webcam"
publish = false

[dependencies]
# Windows-only on purpose: Media Foundation decoding and the shared memory
# handoff to the DirectShow filter are the whole job.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
serde_json = "1"
# TLS 1.3 with the ring backend: no cmake/nasm needed to build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
ring = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
